  return L.divIcon({
    className: '',
    html: `<div style="
      width:${size}px;height:${size}px;border-radius:50% 50% 50% 0;
      background:${color};border:3px solid white;
      display:flex;align-items:center;justify-content:center;

      font-size:${size*0.45}px">

    </div>`,
    iconSize: [size, size],
    iconAnchor: [size/2, size],
    popupAnchor: [0, -size]
  });
}

  });
});

// ── DIBUJA MARCADORES ─────────────────────────────────────────────────────
places.forEach(p => {
  const marker = L.marker([p.lat, p.lng], { icon: icons[p.icon] }).addTo(map);
  const ticketHtml = p.ticket ? `<div class="ticket">🎟 ${p.ticket}</div>` : '';
  marker.bindPopup(`
    <h3>${p.name}</h3>
    <span class="day">${p.day}</span>
    <p class="detail">${p.detail}</p>
    ${ticketHtml}
  `, { maxWidth: 280 });
});

// ── RECORRIDO DEL HOTEL AL SOUTHBANK (línea punteada) ─────────────────────
const hotelRoute = [
  [51.5072,-0.1241],
  [51.5080,-0.1220],
  [51.5072,-0.1224], // Embankment
  [51.5060,-0.1215],
  [51.5045,-0.1205],
  [51.5009,-0.1224], // Westminster Bridge
];
L.polyline(hotelRoute, {
  color: '#FFD700', weight: 3, opacity: 0.6, dashArray: '8,6'
}).addTo(map).bindTooltip('🚶 Hotel → Westminster Bridge (15\' a pie)', {direction:'right'});

// ── ESCALA Y ATRIBUCIÓN ───────────────────────────────────────────────────
L.control.scale({ metric: true, imperial: false }).addTo(map);

// ── VISTA INICIAL ─────────────────────────────────────────────────────────

const allCoords = places.map(p => [p.lat, p.lng]);

]);
